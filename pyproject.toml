[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-ai-event-pipeline"
version = "1.0.0"
description = "Kafka event streaming, AI anomaly detection, Snowflake warehousing and dbt transformations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4,<3"]
snowflake = ["snowflake-connector-python>=3.10,<5"]
aws = ["boto3>=1.34,<2"]
llm = ["openai>=1.60,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8"]
all = ["confluent-kafka>=2.4,<3", "snowflake-connector-python>=3.10,<5", "boto3>=1.34,<2", "pytest>=8,<10", "pytest-cov>=5,<8"]

[project.scripts]
event-pipeline = "event_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
