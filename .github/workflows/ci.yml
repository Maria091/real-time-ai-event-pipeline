name: Python CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install project with test dependencies
        run: pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Offline end-to-end smoke test
        run: python -m event_pipeline.cli demo --count 30 --database data/ci-demo.sqlite --export data/ci-alerts.csv
